services:
  web:
    build: .
    image: pulsovecinal:local
    ports:
      - "8080:80"
    restart: unless-stopped

  api:
    build:
      context: ./backend
    image: pulsovecinal-api:local
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulso}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD; crea tu .env copiando db/.env.example a la raiz}"
      POSTGRES_DB: ${POSTGRES_DB:-pulsovecinal}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-change-in-production}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:8080}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pulso}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD; crea tu .env copiando db/.env.example a la raiz}"
      POSTGRES_DB: ${POSTGRES_DB:-pulsovecinal}
    ports:
      - "${DB_PORT:-5433}:5432"          # 5433 en el host para no chocar con un PG local
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # schema + seed (solo primer arranque)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pulso} -d ${POSTGRES_DB:-pulsovecinal}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
