name: Publish Docker images

on:
  push:
    branches: [main]

jobs:
  frontend:
    name: Front (nginx)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            miguecaramirez/pulsovecinal:latest
            miguecaramirez/pulsovecinal:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  backend:
    name: Backend (FastAPI)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            miguecaramirez/pulsovecinal-backend:latest
            miguecaramirez/pulsovecinal-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  db:
    name: DB (PostGIS + seed)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./db
          push: true
          tags: |
            miguecaramirez/pulsovecinal-db:latest
            miguecaramirez/pulsovecinal-db:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
